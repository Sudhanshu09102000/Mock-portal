<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PDF Page Getter</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--tx:#1b1f27;--mut:#6b7280;--bd:#dfe3ea;--ac:#2563eb;--acx:#fff;--sel:#dbeafe}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--card:#1c1f27;--tx:#e8eaf0;--mut:#9aa1b0;--bd:#2d323d;--ac:#5b8cff;--acx:#0b1020;--sel:#1e2f55}}
:root[data-theme="dark"]{--bg:#12141a;--card:#1c1f27;--tx:#e8eaf0;--mut:#9aa1b0;--bd:#2d323d;--ac:#5b8cff;--acx:#0b1020;--sel:#1e2f55}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:20px 16px 90px}
h1{font-size:22px;margin:0 0 4px}
p.sub{color:var(--mut);margin:0 0 16px}
#drop{border:2px dashed var(--bd);border-radius:14px;background:var(--card);padding:34px 16px;text-align:center;cursor:pointer}
#drop.over{border-color:var(--ac);background:var(--sel)}
#drop b{color:var(--ac)}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:9px;cursor:pointer}
button:hover{border-color:var(--ac)}
button.pri{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button:disabled{opacity:.5;cursor:not-allowed}
input[type=text]{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:9px;padding:8px 12px;width:100%}
#tools{display:none;margin:18px 0 12px;gap:10px;flex-direction:column}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .grow{flex:1;min-width:200px}
#info{color:var(--mut);font-size:14px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.pg{background:var(--card);border:2px solid var(--bd);border-radius:10px;padding:6px;cursor:pointer;position:relative;user-select:none}
.pg.on{border-color:var(--ac);background:var(--sel)}
.pg canvas{width:100%;height:auto;display:block;border-radius:4px;background:#fff}
.pg .n{text-align:center;font-size:13px;margin-top:4px;color:var(--mut)}
.pg.on .n{color:var(--tx);font-weight:600}
.pg .ck{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--ac);color:var(--acx);display:none;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.pg.on .ck{display:flex}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:none;justify-content:center;gap:12px;align-items:center}
#msg{color:var(--mut);font-size:14px}
</style>
</head>
<body>
<main>
  <h1>PDF Page Getter</h1>
  <p class="sub">Upload a PDF, choose the pages you want, download them as a new PDF. Everything runs in your browser — nothing is uploaded.</p>

  <div id="drop"><b>Click to choose a PDF</b> or drag &amp; drop it here
    <input id="file" type="file" accept="application/pdf" hidden>
  </div>

  <div id="tools">
    <div id="info"></div>
    <div class="row">
      <input id="range" class="grow" type="text" placeholder="Type pages, e.g. 1-3, 5, 8-10" autocomplete="off">
      <button id="apply">Apply</button>
    </div>
    <div class="row">
      <button id="all">Select all</button>
      <button id="none">Clear</button>
      <button id="inv">Invert</button>
      <button id="odd">Odd</button>
      <button id="even">Even</button>
    </div>
  </div>

  <div id="grid"></div>
</main>

<div id="bar">
  <span id="msg"></span>
  <button id="dl" class="pri" disabled>Download selected pages</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var bytes=null, name='document.pdf', total=0, sel=new Set(), cards=[], last=null, token=0;

  var drop=$('drop'), file=$('file');
  drop.onclick=function(){file.click()};
  file.onchange=function(){if(file.files[0])load(file.files[0])};
  ['dragover','dragenter'].forEach(function(e){drop.addEventListener(e,function(ev){ev.preventDefault();drop.classList.add('over')})});
  ['dragleave','drop'].forEach(function(e){drop.addEventListener(e,function(ev){ev.preventDefault();drop.classList.remove('over')})});
  drop.addEventListener('drop',function(ev){var f=ev.dataTransfer.files[0];if(f)load(f)});

  async function load(f){
    if(f.type!=='application/pdf'&&!/\.pdf$/i.test(f.name)){alert('Please choose a PDF file.');return}
    var my=++token;
    name=f.name; sel.clear(); cards=[]; last=null; $('grid').innerHTML='';
    $('info').textContent='Reading '+f.name+'…';
    $('tools').style.display='flex';
    bytes=new Uint8Array(await f.arrayBuffer());
    try{
      var doc=await pdfjsLib.getDocument({data:bytes.slice(0)}).promise;
      total=doc.numPages;
      $('info').textContent=f.name+' — '+total+' page'+(total>1?'s':'')+'. Click pages to select (Shift+click for a range).';
      $('bar').style.display='flex';
      for(var i=1;i<=total;i++) addCard(i);
      update();
      for(var p=1;p<=total;p++){
        if(my!==token)return;
        var page=await doc.getPage(p);
        var vp=page.getViewport({scale:0.35});
        var c=cards[p-1].querySelector('canvas');
        c.width=vp.width;c.height=vp.height;
        await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
      }
    }catch(e){
      $('info').textContent='Could not read this PDF ('+(e&&e.message||e)+').';
    }
  }

  function addCard(n){
    var d=document.createElement('div');d.className='pg';
    d.innerHTML='<canvas width="130" height="180"></canvas><div class="ck">✓</div><div class="n">Page '+n+'</div>';
    d.onclick=function(ev){
      if(ev.shiftKey&&last){
        var a=Math.min(last,n),b=Math.max(last,n);
        for(var i=a;i<=b;i++)sel.add(i);
      }else{sel.has(n)?sel.delete(n):sel.add(n)}
      last=n;update();
    };
    $('grid').appendChild(d);cards.push(d);
  }

  function update(){
    cards.forEach(function(c,i){c.classList.toggle('on',sel.has(i+1))});
    $('msg').textContent=sel.size+' of '+total+' selected';
    $('dl').disabled=!sel.size;
  }

  function parse(str){
    var out=new Set();
    str.split(',').forEach(function(part){
      part=part.trim();if(!part)return;
      var m=part.match(/^(\d+)\s*-\s*(\d+)$/);
      if(m){var a=+m[1],b=+m[2];if(a>b){var t=a;a=b;b=t}for(var i=a;i<=b;i++)if(i>=1&&i<=total)out.add(i)}
      else if(/^\d+$/.test(part)){var n=+part;if(n>=1&&n<=total)out.add(n)}
    });
    return out;
  }

  $('apply').onclick=function(){sel=parse($('range').value);update()};
  $('range').addEventListener('keydown',function(e){if(e.key==='Enter')$('apply').click()});
  $('all').onclick=function(){sel=new Set();for(var i=1;i<=total;i++)sel.add(i);update()};
  $('none').onclick=function(){sel.clear();update()};
  $('inv').onclick=function(){var s=new Set();for(var i=1;i<=total;i++)if(!sel.has(i))s.add(i);sel=s;update()};
  $('odd').onclick=function(){sel=new Set();for(var i=1;i<=total;i+=2)sel.add(i);update()};
  $('even').onclick=function(){sel=new Set();for(var i=2;i<=total;i+=2)sel.add(i);update()};

  $('dl').onclick=async function(){
    if(!sel.size)return;
    var btn=$('dl');btn.disabled=true;btn.textContent='Building PDF…';
    try{
      var src=await PDFLib.PDFDocument.load(bytes,{ignoreEncryption:true});
      var out=await PDFLib.PDFDocument.create();
      var idx=Array.from(sel).sort(function(a,b){return a-b}).map(function(n){return n-1});
      var pages=await out.copyPages(src,idx);
      pages.forEach(function(p){out.addPage(p)});
      var data=await out.save();
      var fname=name.replace(/\.pdf$/i,'')+'-selected.pdf';
      var blob=new Blob([data],{type:'application/pdf'});
      var dls=null;
      try{dls=await claude.use('downloads')}catch(e){}
      if(dls){
        try{await dls.save({filename:fname,data:blob})}
        catch(e){if(!e||e.code!=='declined')alert('Download failed: '+(e&&e.message||e))}
      }else{
        var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;
        document.body.appendChild(a);a.click();a.remove();
      }
    }catch(e){
      alert('Could not create the PDF: '+(e&&e.message||e));
    }
    btn.textContent='Download selected pages';update();
  };
})();
</script>
</body>
</html>
